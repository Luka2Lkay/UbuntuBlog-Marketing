name: Frontend Ci

on: 
    push:
        branches:
            - develop

    pull_request:
        branches:
            - develop


jobs:
    frontend-ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4

              with:
                node-version: 22
                cache: npm

            - name: Install Dependencies
              run: npm ci
              
            - name: Run OxLint
              run: npm run lint

            - name: Run Type-check
              run: npm run type-check

            - name: Build frontend
              run: npm run build